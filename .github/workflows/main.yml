name: ACEest Fitness CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Compilation Check
        run: |
          python -m py_compile app.py tests/test_app.py

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other errors as warnings (max line length 127)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test-local:
    name: Unit Testing (Host Environment)
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: |
          pytest -v tests/

  docker-build-and-test:
    name: Docker Assembly & Containerized Testing
    needs: test-local
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Image Assembly
        run: |
          docker build -t aceest-fitness:latest .

      - name: Automated Testing (Inside Containerized Environment)
        run: |
          # Execute Pytest directly inside the assembled container to verify container stability
          docker run --rm aceest-fitness:latest pytest -v tests/

      - name: Verify Container Healthcheck & Run
        run: |
          docker run -d --name aceest-test-container -p 5000:5000 aceest-fitness:latest
          sleep 5
          docker ps
          curl --fail http://localhost:5000/health || exit 1
          docker stop aceest-test-container
          docker rm aceest-test-container
