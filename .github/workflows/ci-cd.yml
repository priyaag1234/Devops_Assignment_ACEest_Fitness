name: ACEest Fitness CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "release/**" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: aceest-fitness
  VERSION: 3.2.4
  PORT: 5000

jobs:

  # ──────────────────────────────────────────────────
  #  Job 1: Lint & Test (matrix: Python 3.10 + 3.11)
  # ──────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Flake8 lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Pytest with coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: coverage.xml

      - name: Archive test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: coverage-html/

  # ──────────────────────────────────────────────────
  #  Job 2: SonarQube Analysis
  # ──────────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt
      - run: pytest tests/ --cov=app --cov-report=xml --cov-fail-under=0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ──────────────────────────────────────────────────
  #  Job 3: Docker Build, Health Check & Push
  # ──────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: sonarqube
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:latest
          load: true

      - name: Container health check
        run: |
          docker run -d --name test-app -p ${{ env.PORT }}:5000 ${{ env.IMAGE_NAME }}:latest
          sleep 8
          curl --fail http://localhost:${{ env.PORT }}/health \
            || (docker logs test-app && exit 1)
          docker stop test-app && docker rm test-app

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ github.run_number }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────
  #  Job 4: Deploy to Kubernetes
  # ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Substitute image tag in manifests
        run: |
          TAG="${{ env.VERSION }}-${{ github.run_number }}"
          sed -i "s|IMAGE_TAG|${TAG}|g" k8s/deployment.yaml
          sed -i "s|DOCKER_HUB_USER|${{ secrets.DOCKER_HUB_USERNAME }}|g" k8s/deployment.yaml

      - name: Apply K8s manifests
        run: |
          kubectl create namespace aceest --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/ -n aceest

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/aceest-deployment \
              -n aceest --timeout=120s
