sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness App
sonar.projectVersion=3.2.4

# Source directories
sonar.sources=app
sonar.tests=tests

# Language
sonar.language=py

# Coverage report (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Lint report
sonar.python.pylint.reportPaths=pylint-report.txt

# Exclusions
sonar.exclusions=venv/**,**/__pycache__/**,**/migrations/**

# Encoding
sonar.sourceEncoding=UTF-8
