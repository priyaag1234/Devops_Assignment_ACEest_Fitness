[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:coverage-html
    --cov-report=xml:coverage.xml

[coverage:run]
source = app
omit =
    */venv/*
    */__pycache__/*

[coverage:report]
fail_under = 70
show_missing = True
